# Пример конфига Стадий 2–3. Один файл на прогон: обучение и оценка описываются
# вместе, поэтому признак и архитектура у них заведомо одни и те же.
#   python -m src.train    --config <этот файл>     # Стадия 2 — обучение
#   python -m src.evaluate --config <этот файл>     # Стадия 3 — оценка
#
# Объём прогона задаётся ТОЛЬКО составом селекторов в data.* (§6.4, v15).
# Механизма подвыборок нет: быстрый прогон = маленький датасет, а не срез большого.
# Для проверки «работает ли пайплайн вообще» есть отдельный крошечный датасет —
# см. experiments/smoke_synth.yaml.

name: lfcc_statpool                # → артефакты в experiments/lfcc_statpool/

feature:
  name: lfcc                       # ключ реестра экстракторов (features.py, --list)
  # overrides: {}                  # опц.: переопределить гиперпараметры признака;
                                   #      меняет хэш → должен совпасть с папкой кэша

model:
  name: statpool_mlp               # ключ реестра моделей (train.py --list)
  params:
    hidden: 128
    dropout: 0.3

data:
  # Селекторы (dataset_id, split); при нескольких — склейка (§3). train/dev из 2019 LA.
  train:
    - {dataset_id: asvspoof2019_la, split: train}
  val:
    - {dataset_id: asvspoof2019_la, split: dev}
  # Тест Стадии 3. Несколько датасетов в одном прогоне — метрики считаются по
  # каждому ОТДЕЛЬНО (общего EER по смеси нет намеренно), отсюда и читается
  # кросс-датасетный вывод (§8).
  test:
    - {dataset_id: asvspoof2019_la, split: test}
    - {dataset_id: for-2seconds, split: test}
  t_fixed: 400                     # общая длина в кадрах (~4 c при hop 10 мс); §6.6
                                   # Стадия 3 берёт t_fixed из чекпойнта, не отсюда

train:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0
  pos_weight: auto                 # auto | none | <число>: коррекция дисбаланса классов
  ckpt_every: 1                    # сохранять чекпойнт каждые N эпох (§7)
  keep_last: 3                     # ротация: держать последние K чекпойнтов (§7)

eval:                              # Стадия 3 (§4); Стадия 2 эту секцию не читает
  weights: best                    # best | final | путь к .pt (§6.5)
  window: fixed                    # окно t_fixed с начала записи — как на валидации
                                   # ('full' / 'sliding' пока не реализованы)
  bootstrap: 1000                  # повторов бутстрэпа для CI; 0 — выключить
  bootstrap_seed: 1337
  ci: 0.95
  min_coverage: 0.99               # ниже — падать: метрика считалась бы по неполному
                                   # тесту (обойти осознанно: --allow-missing)
  shard_rows: 20000                # строк на промежуточный шард скоров (§7)

runtime:                           # переопределяет дефолты config.py (§2, §3)
  device: cpu
  batch_size: 16
  num_workers: 0
  seed: 1337